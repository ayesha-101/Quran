<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A63A2E">
<meta name="apple-mobile-web-app-title" content="بستان القرآن">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" href="/icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>بستان القرآن</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: an Emirati home — Sadu band on top, sand ground, palm/sea/gold accents, family characters guiding each screen */
:root{
  --bg:#F6EFE2; --surface:#FFFCF6; --ink:#2B2620; --muted:#6F6457; --line:#E6DAC4;
  --leaf:#2E7D5B; --leaf-soft:#DCEBDF; --sun:#C9932E; --sun-soft:#F6E7C6; --rose:#B5473A; --rose-soft:#F4DCD6;
  --sky:#2F7F95; --sky-soft:#DCECEF; --page:#FFFCF5; --page-ink:#1E1A15; --sadu-red:#A63A2E; --sadu-dark:#2B2620; --sadu-light:#F3E6CC;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal",system-ui,-apple-system,sans-serif;
  --quran:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130F; --surface:#221C16; --ink:#F1E8DA; --muted:#B4A693; --line:#3A3127;
  --leaf:#6CC49A; --leaf-soft:#1F3A2C; --sun:#E7B957; --sun-soft:#3A2F1C; --rose:#E0806F; --rose-soft:#3F2420;
  --sky:#7FC2D3; --sky-soft:#1C3339; --page:#201A14; --page-ink:#F3EBDD; --sadu-red:#C2503F; --sadu-dark:#0E0B08; --sadu-light:#E8D6B3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#221C16; --ink:#F1E8DA; --muted:#B4A693; --line:#3A3127;
  --leaf:#6CC49A; --leaf-soft:#1F3A2C; --sun:#E7B957; --sun-soft:#3A2F1C; --rose:#E0806F; --rose-soft:#3F2420;
  --sky:#7FC2D3; --sky-soft:#1C3339; --page:#201A14; --page-ink:#F3EBDD; --sadu-red:#C2503F; --sadu-dark:#0E0B08; --sadu-light:#E8D6B3; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.wrap{max-width:900px;margin:0 auto;padding-block:16px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:2.2rem;font-weight:800}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.25rem;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:10px 22px;border-radius:999px;
  font-family:var(--display);font-weight:700;font-size:1.15rem;background:var(--leaf);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.soft{background:var(--leaf-soft);color:var(--leaf);box-shadow:none}
.btn.sun{background:var(--sun);color:#3A2600}
.btn.rose{background:var(--rose);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;min-height:44px;padding:6px 12px}
.btn.big{min-height:76px;font-size:1.45rem;padding:12px 34px}
.back{min-height:48px;padding:6px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-family:var(--display)}

/* home */
.hero{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.hero p{margin:0;font-size:1.05rem}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.kids{grid-template-columns:1fr}}
.kid{position:relative;background:var(--surface);border:3px solid var(--line);border-radius:28px;padding:18px;display:flex;gap:16px;align-items:center;text-align:start;min-height:130px}
.kid:active{transform:scale(.98)}
.avatar{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:2.8rem}
.kid .name{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1}
.kid .meta{font-size:.95rem;color:var(--muted)}
.minibar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.minibar i{display:block;height:100%;background:var(--sun);border-radius:999px}
.garden{background:var(--surface);border-radius:var(--r);padding:16px 18px;border:2px dashed var(--line)}
.beds{display:flex;flex-wrap:wrap;gap:2px;font-size:1.8rem;line-height:1.2;min-height:44px;margin-top:6px}
.parent-btn{align-self:flex-start;position:relative;overflow:hidden}
.parent-btn .fill{position:absolute;inset:0;background:var(--leaf-soft);transform-origin:right;transform:scaleX(0)}
.parent-btn span{position:relative}

/* child */
.childhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--sun-soft);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-family:var(--display);font-size:1.2rem}
.prize{background:var(--surface);border-radius:var(--r);padding:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.track{position:relative;height:26px;margin-block:12px;border-radius:999px;background:var(--leaf-soft);overflow:visible;margin-inline-end:56px}
.track i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:linear-gradient(90deg,var(--leaf),var(--sun));transition:width .6s}
.ipad{position:absolute;inset-inline-end:-58px;top:50%;transform:translateY(-50%);width:46px;height:60px;border-radius:8px;border:4px solid var(--ink);background:var(--sky-soft);display:grid;place-items:center;font-size:1.1rem}
.ipad.won{background:var(--sun);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-62%)}}
.todo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.action{background:var(--sky-soft);border-radius:var(--r);padding:16px;display:flex;gap:12px;align-items:center;text-align:start;min-height:84px}
.action b{font-family:var(--display);font-size:1.25rem;display:block}
.action small{color:var(--muted);font-size:.95rem}
.action .ic{font-size:2rem}
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.st{background:var(--surface);border:3px solid var(--line);border-radius:20px;padding:12px 8px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.st .sn{font-family:var(--display);font-weight:700;font-size:1.3rem}
.st .badge{font-size:.85rem;color:var(--muted)}
.st.mem{border-color:var(--leaf);background:var(--leaf-soft)}
.st.weak{border-color:var(--rose)}
.st.next{border-color:var(--sun);box-shadow:0 0 0 4px var(--sun-soft)}
.sec-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* surah */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{min-height:52px;padding:8px 18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:1.1rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mushaf{background:var(--page);color:var(--page-ink);border-radius:var(--r);padding:22px 20px;border:2px solid var(--line);direction:rtl}
.basmala{font-family:var(--quran);text-align:center;font-size:1.7rem;margin-bottom:10px;opacity:.85}
.ayat{font-family:var(--quran);font-size:2rem;line-height:2.4;text-align:right}
.ayah{border-radius:12px;padding:2px 4px;transition:background .2s}
.ayah.on{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun)}
.ayah.hidden-txt{color:transparent;background:var(--line);border-radius:8px}
.num{display:inline-grid;place-items:center;min-width:1.5em;height:1.5em;border:2px solid var(--leaf);border-radius:50%;font-family:var(--body);font-size:.8rem;margin-inline:4px;vertical-align:middle;color:var(--leaf)}
.big-ayah{font-family:var(--quran);font-size:2.6rem;line-height:2.1;text-align:center;direction:rtl;min-height:3em;display:flex;align-items:center;justify-content:center;padding:10px}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px}
.seg button{min-height:42px;min-width:48px;padding:4px 12px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.status{font-family:var(--display);font-size:1.25rem;color:var(--leaf);min-height:1.6em}
.story{background:var(--surface);border-radius:var(--r);padding:20px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px;max-width:70ch}
.story p{margin:0;font-size:1.15rem;line-height:1.9}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.word{background:var(--sky-soft);border-radius:16px;padding:10px 14px}
.word .w{font-family:var(--quran);font-size:1.5rem;line-height:1.8}
.lesson{background:var(--leaf-soft);border-radius:16px;padding:12px 16px;font-weight:700}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.game{background:var(--surface);border:3px solid var(--line);border-radius:var(--r);padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:110px}
.game b{font-family:var(--display);font-size:1.3rem}
.game small{color:var(--muted)}
.play{background:var(--surface);border-radius:var(--r);padding:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.q{font-family:var(--display);font-size:1.3rem}
.opts{display:grid;gap:10px}
.opt{background:var(--page);color:var(--page-ink);border:3px solid var(--line);border-radius:18px;padding:12px 16px;font-family:var(--quran);font-size:1.6rem;line-height:1.9;text-align:center;min-height:64px}
.opt.name{font-family:var(--display);font-size:1.5rem}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.no{border-color:var(--rose);background:var(--rose-soft);animation:shake .35s}
.opt.done{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.placed{display:flex;flex-direction:column;gap:6px;min-height:40px}
.placed div{font-family:var(--quran);font-size:1.4rem;background:var(--leaf-soft);border-radius:12px;padding:4px 12px;direction:rtl}
.progress-dots{display:flex;gap:6px}
.progress-dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.progress-dots i.ok{background:var(--leaf)}.progress-dots i.no{background:var(--rose)}

/* parent */
.panel{background:var(--surface);border-radius:var(--r);padding:18px;border:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:4px 14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-weight:700}
.chip[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.chip.weakc{border-color:var(--rose)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.note{font-size:.95rem;color:var(--muted);margin:0}
.confirm{background:var(--rose-soft);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* sadu band */
.sadu{height:26px;border-radius:6px;margin-top:4px;background-color:var(--sadu-red);
  background-image:linear-gradient(45deg,var(--sadu-dark) 25%,transparent 25%),linear-gradient(-45deg,var(--sadu-dark) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--sadu-light) 75%),linear-gradient(-45deg,transparent 75%,var(--sadu-light) 75%);
  background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0;box-shadow:inset 0 3px 0 var(--sadu-light),inset 0 -3px 0 var(--sadu-light)}
/* characters */
.buddy{display:flex;align-items:flex-end;gap:10px}
.buddy img{width:auto;height:132px;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.12));transform-origin:bottom center;animation:breathe 3.2s ease-in-out infinite}
.buddy.small img{height:100px}
.buddy.cheer img{animation:hop .5s ease-out 2}
.buddy.think img{animation:tilt .8s ease-in-out 1}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:10px 16px;font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.4;margin-bottom:46px;max-width:32ch;min-width:0}
.bubble::after{content:"";position:absolute;bottom:14px;inset-inline-start:-11px;width:18px;height:18px;background:var(--surface);border-inline-start:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(-45deg);border-radius:0 0 0 4px}
@keyframes breathe{50%{transform:translateY(-3px) scale(1.01)}}
@keyframes hop{40%{transform:translateY(-16px) rotate(-3deg)}}
@keyframes tilt{50%{transform:rotate(4deg)}}
/* journey stations */
.stations{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.station{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--bg);border:2px solid var(--line);font-weight:700;font-size:.85rem;text-align:center;opacity:.55}
.station .si{font-size:1.6rem;line-height:1}
.station.done{opacity:1;border-color:var(--leaf);background:var(--leaf-soft)}
.station.here{opacity:1;border-color:var(--sun);background:var(--sun-soft);box-shadow:0 0 0 3px var(--sun-soft)}
/* celebration */
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast div{background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-family:var(--display);font-size:1.2rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.celebrate{position:fixed;inset:0;background:rgba(10,30,30,.6);display:grid;place-items:center;z-index:30;padding:20px}
.celebrate .card{background:var(--surface);border-radius:32px;padding:28px;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.celebrate .gift{font-size:4rem;line-height:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" class="wrap" dir="rtl" lang="ar"></div>
<div class="toast" id="toast" hidden><div></div></div>

<script>
const QURAN = {"1":{"n":1,"name":"الفاتحة","v":["بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ","ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ","ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ","مَٰلِكِ يَوۡمِ ٱلدِّينِ","إِيَّاكَ نَعۡبُدُ وَإِيَّاكَ نَسۡتَعِينُ","ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ","صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ"],"g":1},"67":{"n":67,"name":"الملك","v":["تَبَٰرَكَ ٱلَّذِي بِيَدِهِ ٱلۡمُلۡكُ وَهُوَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٌ","ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ","ٱلَّذِي خَلَقَ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗاۖ مَّا تَرَىٰ فِي خَلۡقِ ٱلرَّحۡمَٰنِ مِن تَفَٰوُتٖۖ فَٱرۡجِعِ ٱلۡبَصَرَ هَلۡ تَرَىٰ مِن فُطُورٖ","ثُمَّ ٱرۡجِعِ ٱلۡبَصَرَ كَرَّتَيۡنِ يَنقَلِبۡ إِلَيۡكَ ٱلۡبَصَرُ خَاسِئٗا وَهُوَ حَسِيرٞ","وَلَقَدۡ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنۡيَا بِمَصَٰبِيحَ وَجَعَلۡنَٰهَا رُجُومٗا لِّلشَّيَٰطِينِۖ وَأَعۡتَدۡنَا لَهُمۡ عَذَابَ ٱلسَّعِيرِ","وَلِلَّذِينَ كَفَرُواْ بِرَبِّهِمۡ عَذَابُ جَهَنَّمَۖ وَبِئۡسَ ٱلۡمَصِيرُ","إِذَآ أُلۡقُواْ فِيهَا سَمِعُواْ لَهَا شَهِيقٗا وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ ٱلۡغَيۡظِۖ كُلَّمَآ أُلۡقِيَ فِيهَا فَوۡجٞ سَأَلَهُمۡ خَزَنَتُهَآ أَلَمۡ يَأۡتِكُمۡ نَذِيرٞ","قَالُواْ بَلَىٰ قَدۡ جَآءَنَا نَذِيرٞ فَكَذَّبۡنَا وَقُلۡنَا مَا نَزَّلَ ٱللَّهُ مِن شَيۡءٍ إِنۡ أَنتُمۡ إِلَّا فِي ضَلَٰلٖ كَبِيرٖ","وَقَالُواْ لَوۡ كُنَّا نَسۡمَعُ أَوۡ نَعۡقِلُ مَا كُنَّا فِيٓ أَصۡحَٰبِ ٱلسَّعِيرِ","فَٱعۡتَرَفُواْ بِذَنۢبِهِمۡ فَسُحۡقٗا لِّأَصۡحَٰبِ ٱلسَّعِيرِ","إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ","وَأَسِرُّواْ قَوۡلَكُمۡ أَوِ ٱجۡهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ ٱلصُّدُورِ","أَلَا يَعۡلَمُ مَنۡ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ","هُوَ ٱلَّذِي جَعَلَ لَكُمُ ٱلۡأَرۡضَ ذَلُولٗا فَٱمۡشُواْ فِي مَنَاكِبِهَا وَكُلُواْ مِن رِّزۡقِهِۦۖ وَإِلَيۡهِ ٱلنُّشُورُ","ءَأَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يَخۡسِفَ بِكُمُ ٱلۡأَرۡضَ فَإِذَا هِيَ تَمُورُ","أَمۡ أَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يُرۡسِلَ عَلَيۡكُمۡ حَاصِبٗاۖ فَسَتَعۡلَمُونَ كَيۡفَ نَذِيرِ","وَلَقَدۡ كَذَّبَ ٱلَّذِينَ مِن قَبۡلِهِمۡ فَكَيۡفَ كَانَ نَكِيرِ","أَوَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ فَوۡقَهُمۡ صَـٰٓفَّـٰتٖ وَيَقۡبِضۡنَۚ مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ إِنَّهُۥ بِكُلِّ شَيۡءِۭ بَصِيرٌ","أَمَّنۡ هَٰذَا ٱلَّذِي هُوَ جُندٞ لَّكُمۡ يَنصُرُكُم مِّن دُونِ ٱلرَّحۡمَٰنِۚ إِنِ ٱلۡكَٰفِرُونَ إِلَّا فِي غُرُورٍ","أَمَّنۡ هَٰذَا ٱلَّذِي يَرۡزُقُكُمۡ إِنۡ أَمۡسَكَ رِزۡقَهُۥۚ بَل لَّجُّواْ فِي عُتُوّٖ وَنُفُورٍ","أَفَمَن يَمۡشِي مُكِبًّا عَلَىٰ وَجۡهِهِۦٓ أَهۡدَىٰٓ أَمَّن يَمۡشِي سَوِيًّا عَلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ","قُلۡ هُوَ ٱلَّذِيٓ أَنشَأَكُمۡ وَجَعَلَ لَكُمُ ٱلسَّمۡعَ وَٱلۡأَبۡصَٰرَ وَٱلۡأَفۡـِٔدَةَۚ قَلِيلٗا مَّا تَشۡكُرُونَ","قُلۡ هُوَ ٱلَّذِي ذَرَأَكُمۡ فِي ٱلۡأَرۡضِ وَإِلَيۡهِ تُحۡشَرُونَ","وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلۡوَعۡدُ إِن كُنتُمۡ صَٰدِقِينَ","قُلۡ إِنَّمَا ٱلۡعِلۡمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٞ مُّبِينٞ","فَلَمَّا رَأَوۡهُ زُلۡفَةٗ سِيٓـَٔتۡ وُجُوهُ ٱلَّذِينَ كَفَرُواْ وَقِيلَ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تَدَّعُونَ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَهۡلَكَنِيَ ٱللَّهُ وَمَن مَّعِيَ أَوۡ رَحِمَنَا فَمَن يُجِيرُ ٱلۡكَٰفِرِينَ مِنۡ عَذَابٍ أَلِيمٖ","قُلۡ هُوَ ٱلرَّحۡمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيۡهِ تَوَكَّلۡنَاۖ فَسَتَعۡلَمُونَ مَنۡ هُوَ فِي ضَلَٰلٖ مُّبِينٖ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَصۡبَحَ مَآؤُكُمۡ غَوۡرٗا فَمَن يَأۡتِيكُم بِمَآءٖ مَّعِينِۭ"],"g":5242},"68":{"n":68,"name":"القلم","v":["نٓۚ وَٱلۡقَلَمِ وَمَا يَسۡطُرُونَ","مَآ أَنتَ بِنِعۡمَةِ رَبِّكَ بِمَجۡنُونٖ","وَإِنَّ لَكَ لَأَجۡرًا غَيۡرَ مَمۡنُونٖ","وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖ","فَسَتُبۡصِرُ وَيُبۡصِرُونَ","بِأَييِّكُمُ ٱلۡمَفۡتُونُ","إِنَّ رَبَّكَ هُوَ أَعۡلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعۡلَمُ بِٱلۡمُهۡتَدِينَ","فَلَا تُطِعِ ٱلۡمُكَذِّبِينَ","وَدُّواْ لَوۡ تُدۡهِنُ فَيُدۡهِنُونَ","وَلَا تُطِعۡ كُلَّ حَلَّافٖ مَّهِينٍ","هَمَّازٖ مَّشَّآءِۭ بِنَمِيمٖ","مَّنَّاعٖ لِّلۡخَيۡرِ مُعۡتَدٍ أَثِيمٍ","عُتُلِّۭ بَعۡدَ ذَٰلِكَ زَنِيمٍ","أَن كَانَ ذَا مَالٖ وَبَنِينَ","إِذَا تُتۡلَىٰ عَلَيۡهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلۡأَوَّلِينَ","سَنَسِمُهُۥ عَلَى ٱلۡخُرۡطُومِ","إِنَّا بَلَوۡنَٰهُمۡ كَمَا بَلَوۡنَآ أَصۡحَٰبَ ٱلۡجَنَّةِ إِذۡ أَقۡسَمُواْ لَيَصۡرِمُنَّهَا مُصۡبِحِينَ","وَلَا يَسۡتَثۡنُونَ","فَطَافَ عَلَيۡهَا طَآئِفٞ مِّن رَّبِّكَ وَهُمۡ نَآئِمُونَ","فَأَصۡبَحَتۡ كَٱلصَّرِيمِ","فَتَنَادَوۡاْ مُصۡبِحِينَ","أَنِ ٱغۡدُواْ عَلَىٰ حَرۡثِكُمۡ إِن كُنتُمۡ صَٰرِمِينَ","فَٱنطَلَقُواْ وَهُمۡ يَتَخَٰفَتُونَ","أَن لَّا يَدۡخُلَنَّهَا ٱلۡيَوۡمَ عَلَيۡكُم مِّسۡكِينٞ","وَغَدَوۡاْ عَلَىٰ حَرۡدٖ قَٰدِرِينَ","فَلَمَّا رَأَوۡهَا قَالُوٓاْ إِنَّا لَضَآلُّونَ","بَلۡ نَحۡنُ مَحۡرُومُونَ","قَالَ أَوۡسَطُهُمۡ أَلَمۡ أَقُل لَّكُمۡ لَوۡلَا تُسَبِّحُونَ","قَالُواْ سُبۡحَٰنَ رَبِّنَآ إِنَّا كُنَّا ظَٰلِمِينَ","فَأَقۡبَلَ بَعۡضُهُمۡ عَلَىٰ بَعۡضٖ يَتَلَٰوَمُونَ","قَالُواْ يَٰوَيۡلَنَآ إِنَّا كُنَّا طَٰغِينَ","عَسَىٰ رَبُّنَآ أَن يُبۡدِلَنَا خَيۡرٗا مِّنۡهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ","كَذَٰلِكَ ٱلۡعَذَابُۖ وَلَعَذَابُ ٱلۡأٓخِرَةِ أَكۡبَرُۚ لَوۡ كَانُواْ يَعۡلَمُونَ","إِنَّ لِلۡمُتَّقِينَ عِندَ رَبِّهِمۡ جَنَّـٰتِ ٱلنَّعِيمِ","أَفَنَجۡعَلُ ٱلۡمُسۡلِمِينَ كَٱلۡمُجۡرِمِينَ","مَا لَكُمۡ كَيۡفَ تَحۡكُمُونَ","أَمۡ لَكُمۡ كِتَٰبٞ فِيهِ تَدۡرُسُونَ","إِنَّ لَكُمۡ فِيهِ لَمَا تَخَيَّرُونَ","أَمۡ لَكُمۡ أَيۡمَٰنٌ عَلَيۡنَا بَٰلِغَةٌ إِلَىٰ يَوۡمِ ٱلۡقِيَٰمَةِ إِنَّ لَكُمۡ لَمَا تَحۡكُمُونَ","سَلۡهُمۡ أَيُّهُم بِذَٰلِكَ زَعِيمٌ","أَمۡ لَهُمۡ شُرَكَآءُ فَلۡيَأۡتُواْ بِشُرَكَآئِهِمۡ إِن كَانُواْ صَٰدِقِينَ","يَوۡمَ يُكۡشَفُ عَن سَاقٖ وَيُدۡعَوۡنَ إِلَى ٱلسُّجُودِ فَلَا يَسۡتَطِيعُونَ","خَٰشِعَةً أَبۡصَٰرُهُمۡ تَرۡهَقُهُمۡ ذِلَّةٞۖ وَقَدۡ كَانُواْ يُدۡعَوۡنَ إِلَى ٱلسُّجُودِ وَهُمۡ سَٰلِمُونَ","فَذَرۡنِي وَمَن يُكَذِّبُ بِهَٰذَا ٱلۡحَدِيثِۖ سَنَسۡتَدۡرِجُهُم مِّنۡ حَيۡثُ لَا يَعۡلَمُونَ","وَأُمۡلِي لَهُمۡۚ إِنَّ كَيۡدِي مَتِينٌ","أَمۡ تَسۡـَٔلُهُمۡ أَجۡرٗا فَهُم مِّن مَّغۡرَمٖ مُّثۡقَلُونَ","أَمۡ عِندَهُمُ ٱلۡغَيۡبُ فَهُمۡ يَكۡتُبُونَ","فَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ ٱلۡحُوتِ إِذۡ نَادَىٰ وَهُوَ مَكۡظُومٞ","لَّوۡلَآ أَن تَدَٰرَكَهُۥ نِعۡمَةٞ مِّن رَّبِّهِۦ لَنُبِذَ بِٱلۡعَرَآءِ وَهُوَ مَذۡمُومٞ","فَٱجۡتَبَٰهُ رَبُّهُۥ فَجَعَلَهُۥ مِنَ ٱلصَّـٰلِحِينَ","وَإِن يَكَادُ ٱلَّذِينَ كَفَرُواْ لَيُزۡلِقُونَكَ بِأَبۡصَٰرِهِمۡ لَمَّا سَمِعُواْ ٱلذِّكۡرَ وَيَقُولُونَ إِنَّهُۥ لَمَجۡنُونٞ","وَمَا هُوَ إِلَّا ذِكۡرٞ لِّلۡعَٰلَمِينَ"],"g":5272},"69":{"n":69,"name":"الحاقة","v":["ٱلۡحَآقَّةُ","مَا ٱلۡحَآقَّةُ","وَمَآ أَدۡرَىٰكَ مَا ٱلۡحَآقَّةُ","كَذَّبَتۡ ثَمُودُ وَعَادُۢ بِٱلۡقَارِعَةِ","فَأَمَّا ثَمُودُ فَأُهۡلِكُواْ بِٱلطَّاغِيَةِ","وَأَمَّا عَادٞ فَأُهۡلِكُواْ بِرِيحٖ صَرۡصَرٍ عَاتِيَةٖ","سَخَّرَهَا عَلَيۡهِمۡ سَبۡعَ لَيَالٖ وَثَمَٰنِيَةَ أَيَّامٍ حُسُومٗاۖ فَتَرَى ٱلۡقَوۡمَ فِيهَا صَرۡعَىٰ كَأَنَّهُمۡ أَعۡجَازُ نَخۡلٍ خَاوِيَةٖ","فَهَلۡ تَرَىٰ لَهُم مِّنۢ بَاقِيَةٖ","وَجَآءَ فِرۡعَوۡنُ وَمَن قَبۡلَهُۥ وَٱلۡمُؤۡتَفِكَٰتُ بِٱلۡخَاطِئَةِ","فَعَصَوۡاْ رَسُولَ رَبِّهِمۡ فَأَخَذَهُمۡ أَخۡذَةٗ رَّابِيَةً","إِنَّا لَمَّا طَغَا ٱلۡمَآءُ حَمَلۡنَٰكُمۡ فِي ٱلۡجَارِيَةِ","لِنَجۡعَلَهَا لَكُمۡ تَذۡكِرَةٗ وَتَعِيَهَآ أُذُنٞ وَٰعِيَةٞ","فَإِذَا نُفِخَ فِي ٱلصُّورِ نَفۡخَةٞ وَٰحِدَةٞ","وَحُمِلَتِ ٱلۡأَرۡضُ وَٱلۡجِبَالُ فَدُكَّتَا دَكَّةٗ وَٰحِدَةٗ","فَيَوۡمَئِذٖ وَقَعَتِ ٱلۡوَاقِعَةُ","وَٱنشَقَّتِ ٱلسَّمَآءُ فَهِيَ يَوۡمَئِذٖ وَاهِيَةٞ","وَٱلۡمَلَكُ عَلَىٰٓ أَرۡجَآئِهَاۚ وَيَحۡمِلُ عَرۡشَ رَبِّكَ فَوۡقَهُمۡ يَوۡمَئِذٖ ثَمَٰنِيَةٞ","يَوۡمَئِذٖ تُعۡرَضُونَ لَا تَخۡفَىٰ مِنكُمۡ خَافِيَةٞ","فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ ٱقۡرَءُواْ كِتَٰبِيَهۡ","إِنِّي ظَنَنتُ أَنِّي مُلَٰقٍ حِسَابِيَهۡ","فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","فِي جَنَّةٍ عَالِيَةٖ","قُطُوفُهَا دَانِيَةٞ","كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ","وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيۡتَنِي لَمۡ أُوتَ كِتَٰبِيَهۡ","وَلَمۡ أَدۡرِ مَا حِسَابِيَهۡ","يَٰلَيۡتَهَا كَانَتِ ٱلۡقَاضِيَةَ","مَآ أَغۡنَىٰ عَنِّي مَالِيَهۡۜ","هَلَكَ عَنِّي سُلۡطَٰنِيَهۡ","خُذُوهُ فَغُلُّوهُ","ثُمَّ ٱلۡجَحِيمَ صَلُّوهُ","ثُمَّ فِي سِلۡسِلَةٖ ذَرۡعُهَا سَبۡعُونَ ذِرَاعٗا فَٱسۡلُكُوهُ","إِنَّهُۥ كَانَ لَا يُؤۡمِنُ بِٱللَّهِ ٱلۡعَظِيمِ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ","فَلَيۡسَ لَهُ ٱلۡيَوۡمَ هَٰهُنَا حَمِيمٞ","وَلَا طَعَامٌ إِلَّا مِنۡ غِسۡلِينٖ","لَّا يَأۡكُلُهُۥٓ إِلَّا ٱلۡخَٰطِـُٔونَ","فَلَآ أُقۡسِمُ بِمَا تُبۡصِرُونَ","وَمَا لَا تُبۡصِرُونَ","إِنَّهُۥ لَقَوۡلُ رَسُولٖ كَرِيمٖ","وَمَا هُوَ بِقَوۡلِ شَاعِرٖۚ قَلِيلٗا مَّا تُؤۡمِنُونَ","وَلَا بِقَوۡلِ كَاهِنٖۚ قَلِيلٗا مَّا تَذَكَّرُونَ","تَنزِيلٞ مِّن رَّبِّ ٱلۡعَٰلَمِينَ","وَلَوۡ تَقَوَّلَ عَلَيۡنَا بَعۡضَ ٱلۡأَقَاوِيلِ","لَأَخَذۡنَا مِنۡهُ بِٱلۡيَمِينِ","ثُمَّ لَقَطَعۡنَا مِنۡهُ ٱلۡوَتِينَ","فَمَا مِنكُم مِّنۡ أَحَدٍ عَنۡهُ حَٰجِزِينَ","وَإِنَّهُۥ لَتَذۡكِرَةٞ لِّلۡمُتَّقِينَ","وَإِنَّا لَنَعۡلَمُ أَنَّ مِنكُم مُّكَذِّبِينَ","وَإِنَّهُۥ لَحَسۡرَةٌ عَلَى ٱلۡكَٰفِرِينَ","وَإِنَّهُۥ لَحَقُّ ٱلۡيَقِينِ","فَسَبِّحۡ بِٱسۡمِ رَبِّكَ ٱلۡعَظِيمِ"],"g":5324},"70":{"n":70,"name":"المعارج","v":["سَأَلَ سَآئِلُۢ بِعَذَابٖ وَاقِعٖ","لِّلۡكَٰفِرِينَ لَيۡسَ لَهُۥ دَافِعٞ","مِّنَ ٱللَّهِ ذِي ٱلۡمَعَارِجِ","تَعۡرُجُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ إِلَيۡهِ فِي يَوۡمٖ كَانَ مِقۡدَارُهُۥ خَمۡسِينَ أَلۡفَ سَنَةٖ","فَٱصۡبِرۡ صَبۡرٗا جَمِيلًا","إِنَّهُمۡ يَرَوۡنَهُۥ بَعِيدٗا","وَنَرَىٰهُ قَرِيبٗا","يَوۡمَ تَكُونُ ٱلسَّمَآءُ كَٱلۡمُهۡلِ","وَتَكُونُ ٱلۡجِبَالُ كَٱلۡعِهۡنِ","وَلَا يَسۡـَٔلُ حَمِيمٌ حَمِيمٗا","يُبَصَّرُونَهُمۡۚ يَوَدُّ ٱلۡمُجۡرِمُ لَوۡ يَفۡتَدِي مِنۡ عَذَابِ يَوۡمِئِذِۭ بِبَنِيهِ","وَصَٰحِبَتِهِۦ وَأَخِيهِ","وَفَصِيلَتِهِ ٱلَّتِي تُـٔۡوِيهِ","وَمَن فِي ٱلۡأَرۡضِ جَمِيعٗا ثُمَّ يُنجِيهِ","كَلَّآۖ إِنَّهَا لَظَىٰ","نَزَّاعَةٗ لِّلشَّوَىٰ","تَدۡعُواْ مَنۡ أَدۡبَرَ وَتَوَلَّىٰ","وَجَمَعَ فَأَوۡعَىٰٓ","۞إِنَّ ٱلۡإِنسَٰنَ خُلِقَ هَلُوعًا","إِذَا مَسَّهُ ٱلشَّرُّ جَزُوعٗا","وَإِذَا مَسَّهُ ٱلۡخَيۡرُ مَنُوعًا","إِلَّا ٱلۡمُصَلِّينَ","ٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ دَآئِمُونَ","وَٱلَّذِينَ فِيٓ أَمۡوَٰلِهِمۡ حَقّٞ مَّعۡلُومٞ","لِّلسَّآئِلِ وَٱلۡمَحۡرُومِ","وَٱلَّذِينَ يُصَدِّقُونَ بِيَوۡمِ ٱلدِّينِ","وَٱلَّذِينَ هُم مِّنۡ عَذَابِ رَبِّهِم مُّشۡفِقُونَ","إِنَّ عَذَابَ رَبِّهِمۡ غَيۡرُ مَأۡمُونٖ","وَٱلَّذِينَ هُمۡ لِفُرُوجِهِمۡ حَٰفِظُونَ","إِلَّا عَلَىٰٓ أَزۡوَٰجِهِمۡ أَوۡ مَا مَلَكَتۡ أَيۡمَٰنُهُمۡ فَإِنَّهُمۡ غَيۡرُ مَلُومِينَ","فَمَنِ ٱبۡتَغَىٰ وَرَآءَ ذَٰلِكَ فَأُوْلَـٰٓئِكَ هُمُ ٱلۡعَادُونَ","وَٱلَّذِينَ هُمۡ لِأَمَٰنَٰتِهِمۡ وَعَهۡدِهِمۡ رَٰعُونَ","وَٱلَّذِينَ هُم بِشَهَٰدَٰتِهِمۡ قَآئِمُونَ","وَٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ يُحَافِظُونَ","أُوْلَـٰٓئِكَ فِي جَنَّـٰتٖ مُّكۡرَمُونَ","فَمَالِ ٱلَّذِينَ كَفَرُواْ قِبَلَكَ مُهۡطِعِينَ","عَنِ ٱلۡيَمِينِ وَعَنِ ٱلشِّمَالِ عِزِينَ","أَيَطۡمَعُ كُلُّ ٱمۡرِيٕٖ مِّنۡهُمۡ أَن يُدۡخَلَ جَنَّةَ نَعِيمٖ","كَلَّآۖ إِنَّا خَلَقۡنَٰهُم مِّمَّا يَعۡلَمُونَ","فَلَآ أُقۡسِمُ بِرَبِّ ٱلۡمَشَٰرِقِ وَٱلۡمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ","عَلَىٰٓ أَن نُّبَدِّلَ خَيۡرٗا مِّنۡهُمۡ وَمَا نَحۡنُ بِمَسۡبُوقِينَ","فَذَرۡهُمۡ يَخُوضُواْ وَيَلۡعَبُواْ حَتَّىٰ يُلَٰقُواْ يَوۡمَهُمُ ٱلَّذِي يُوعَدُونَ","يَوۡمَ يَخۡرُجُونَ مِنَ ٱلۡأَجۡدَاثِ سِرَاعٗا كَأَنَّهُمۡ إِلَىٰ نُصُبٖ يُوفِضُونَ","خَٰشِعَةً أَبۡصَٰرُهُمۡ تَرۡهَقُهُمۡ ذِلَّةٞۚ ذَٰلِكَ ٱلۡيَوۡمُ ٱلَّذِي كَانُواْ يُوعَدُونَ"],"g":5376},"71":{"n":71,"name":"نوح","v":["إِنَّآ أَرۡسَلۡنَا نُوحًا إِلَىٰ قَوۡمِهِۦٓ أَنۡ أَنذِرۡ قَوۡمَكَ مِن قَبۡلِ أَن يَأۡتِيَهُمۡ عَذَابٌ أَلِيمٞ","قَالَ يَٰقَوۡمِ إِنِّي لَكُمۡ نَذِيرٞ مُّبِينٌ","أَنِ ٱعۡبُدُواْ ٱللَّهَ وَٱتَّقُوهُ وَأَطِيعُونِ","يَغۡفِرۡ لَكُم مِّن ذُنُوبِكُمۡ وَيُؤَخِّرۡكُمۡ إِلَىٰٓ أَجَلٖ مُّسَمًّىۚ إِنَّ أَجَلَ ٱللَّهِ إِذَا جَآءَ لَا يُؤَخَّرُۚ لَوۡ كُنتُمۡ تَعۡلَمُونَ","قَالَ رَبِّ إِنِّي دَعَوۡتُ قَوۡمِي لَيۡلٗا وَنَهَارٗا","فَلَمۡ يَزِدۡهُمۡ دُعَآءِيٓ إِلَّا فِرَارٗا","وَإِنِّي كُلَّمَا دَعَوۡتُهُمۡ لِتَغۡفِرَ لَهُمۡ جَعَلُوٓاْ أَصَٰبِعَهُمۡ فِيٓ ءَاذَانِهِمۡ وَٱسۡتَغۡشَوۡاْ ثِيَابَهُمۡ وَأَصَرُّواْ وَٱسۡتَكۡبَرُواْ ٱسۡتِكۡبَارٗا","ثُمَّ إِنِّي دَعَوۡتُهُمۡ جِهَارٗا","ثُمَّ إِنِّيٓ أَعۡلَنتُ لَهُمۡ وَأَسۡرَرۡتُ لَهُمۡ إِسۡرَارٗا","فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا","يُرۡسِلِ ٱلسَّمَآءَ عَلَيۡكُم مِّدۡرَارٗا","وَيُمۡدِدۡكُم بِأَمۡوَٰلٖ وَبَنِينَ وَيَجۡعَل لَّكُمۡ جَنَّـٰتٖ وَيَجۡعَل لَّكُمۡ أَنۡهَٰرٗا","مَّا لَكُمۡ لَا تَرۡجُونَ لِلَّهِ وَقَارٗا","وَقَدۡ خَلَقَكُمۡ أَطۡوَارًا","أَلَمۡ تَرَوۡاْ كَيۡفَ خَلَقَ ٱللَّهُ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗا","وَجَعَلَ ٱلۡقَمَرَ فِيهِنَّ نُورٗا وَجَعَلَ ٱلشَّمۡسَ سِرَاجٗا","وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلۡأَرۡضِ نَبَاتٗا","ثُمَّ يُعِيدُكُمۡ فِيهَا وَيُخۡرِجُكُمۡ إِخۡرَاجٗا","وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطٗا","لِّتَسۡلُكُواْ مِنۡهَا سُبُلٗا فِجَاجٗا","قَالَ نُوحٞ رَّبِّ إِنَّهُمۡ عَصَوۡنِي وَٱتَّبَعُواْ مَن لَّمۡ يَزِدۡهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَارٗا","وَمَكَرُواْ مَكۡرٗا كُبَّارٗا","وَقَالُواْ لَا تَذَرُنَّ ءَالِهَتَكُمۡ وَلَا تَذَرُنَّ وَدّٗا وَلَا سُوَاعٗا وَلَا يَغُوثَ وَيَعُوقَ وَنَسۡرٗا","وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا","مِّمَّا خَطِيٓـَٰٔتِهِمۡ أُغۡرِقُواْ فَأُدۡخِلُواْ نَارٗا فَلَمۡ يَجِدُواْ لَهُم مِّن دُونِ ٱللَّهِ أَنصَارٗا","وَقَالَ نُوحٞ رَّبِّ لَا تَذَرۡ عَلَى ٱلۡأَرۡضِ مِنَ ٱلۡكَٰفِرِينَ دَيَّارًا","إِنَّكَ إِن تَذَرۡهُمۡ يُضِلُّواْ عِبَادَكَ وَلَا يَلِدُوٓاْ إِلَّا فَاجِرٗا كَفَّارٗا","رَّبِّ ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِمَن دَخَلَ بَيۡتِيَ مُؤۡمِنٗا وَلِلۡمُؤۡمِنِينَ وَٱلۡمُؤۡمِنَٰتِۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا تَبَارَۢا"],"g":5420},"72":{"n":72,"name":"الجن","v":["قُلۡ أُوحِيَ إِلَيَّ أَنَّهُ ٱسۡتَمَعَ نَفَرٞ مِّنَ ٱلۡجِنِّ فَقَالُوٓاْ إِنَّا سَمِعۡنَا قُرۡءَانًا عَجَبٗا","يَهۡدِيٓ إِلَى ٱلرُّشۡدِ فَـَٔامَنَّا بِهِۦۖ وَلَن نُّشۡرِكَ بِرَبِّنَآ أَحَدٗا","وَأَنَّهُۥ تَعَٰلَىٰ جَدُّ رَبِّنَا مَا ٱتَّخَذَ صَٰحِبَةٗ وَلَا وَلَدٗا","وَأَنَّهُۥ كَانَ يَقُولُ سَفِيهُنَا عَلَى ٱللَّهِ شَطَطٗا","وَأَنَّا ظَنَنَّآ أَن لَّن تَقُولَ ٱلۡإِنسُ وَٱلۡجِنُّ عَلَى ٱللَّهِ كَذِبٗا","وَأَنَّهُۥ كَانَ رِجَالٞ مِّنَ ٱلۡإِنسِ يَعُوذُونَ بِرِجَالٖ مِّنَ ٱلۡجِنِّ فَزَادُوهُمۡ رَهَقٗا","وَأَنَّهُمۡ ظَنُّواْ كَمَا ظَنَنتُمۡ أَن لَّن يَبۡعَثَ ٱللَّهُ أَحَدٗا","وَأَنَّا لَمَسۡنَا ٱلسَّمَآءَ فَوَجَدۡنَٰهَا مُلِئَتۡ حَرَسٗا شَدِيدٗا وَشُهُبٗا","وَأَنَّا كُنَّا نَقۡعُدُ مِنۡهَا مَقَٰعِدَ لِلسَّمۡعِۖ فَمَن يَسۡتَمِعِ ٱلۡأٓنَ يَجِدۡ لَهُۥ شِهَابٗا رَّصَدٗا","وَأَنَّا لَا نَدۡرِيٓ أَشَرٌّ أُرِيدَ بِمَن فِي ٱلۡأَرۡضِ أَمۡ أَرَادَ بِهِمۡ رَبُّهُمۡ رَشَدٗا","وَأَنَّا مِنَّا ٱلصَّـٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَۖ كُنَّا طَرَآئِقَ قِدَدٗا","وَأَنَّا ظَنَنَّآ أَن لَّن نُّعۡجِزَ ٱللَّهَ فِي ٱلۡأَرۡضِ وَلَن نُّعۡجِزَهُۥ هَرَبٗا","وَأَنَّا لَمَّا سَمِعۡنَا ٱلۡهُدَىٰٓ ءَامَنَّا بِهِۦۖ فَمَن يُؤۡمِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخۡسٗا وَلَا رَهَقٗا","وَأَنَّا مِنَّا ٱلۡمُسۡلِمُونَ وَمِنَّا ٱلۡقَٰسِطُونَۖ فَمَنۡ أَسۡلَمَ فَأُوْلَـٰٓئِكَ تَحَرَّوۡاْ رَشَدٗا","وَأَمَّا ٱلۡقَٰسِطُونَ فَكَانُواْ لِجَهَنَّمَ حَطَبٗا","وَأَلَّوِ ٱسۡتَقَٰمُواْ عَلَى ٱلطَّرِيقَةِ لَأَسۡقَيۡنَٰهُم مَّآءً غَدَقٗا","لِّنَفۡتِنَهُمۡ فِيهِۚ وَمَن يُعۡرِضۡ عَن ذِكۡرِ رَبِّهِۦ يَسۡلُكۡهُ عَذَابٗا صَعَدٗا","وَأَنَّ ٱلۡمَسَٰجِدَ لِلَّهِ فَلَا تَدۡعُواْ مَعَ ٱللَّهِ أَحَدٗا","وَأَنَّهُۥ لَمَّا قَامَ عَبۡدُ ٱللَّهِ يَدۡعُوهُ كَادُواْ يَكُونُونَ عَلَيۡهِ لِبَدٗا","قُلۡ إِنَّمَآ أَدۡعُواْ رَبِّي وَلَآ أُشۡرِكُ بِهِۦٓ أَحَدٗا","قُلۡ إِنِّي لَآ أَمۡلِكُ لَكُمۡ ضَرّٗا وَلَا رَشَدٗا","قُلۡ إِنِّي لَن يُجِيرَنِي مِنَ ٱللَّهِ أَحَدٞ وَلَنۡ أَجِدَ مِن دُونِهِۦ مُلۡتَحَدًا","إِلَّا بَلَٰغٗا مِّنَ ٱللَّهِ وَرِسَٰلَٰتِهِۦۚ وَمَن يَعۡصِ ٱللَّهَ وَرَسُولَهُۥ فَإِنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَدًا","حَتَّىٰٓ إِذَا رَأَوۡاْ مَا يُوعَدُونَ فَسَيَعۡلَمُونَ مَنۡ أَضۡعَفُ نَاصِرٗا وَأَقَلُّ عَدَدٗا","قُلۡ إِنۡ أَدۡرِيٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمۡ يَجۡعَلُ لَهُۥ رَبِّيٓ أَمَدًا","عَٰلِمُ ٱلۡغَيۡبِ فَلَا يُظۡهِرُ عَلَىٰ غَيۡبِهِۦٓ أَحَدًا","إِلَّا مَنِ ٱرۡتَضَىٰ مِن رَّسُولٖ فَإِنَّهُۥ يَسۡلُكُ مِنۢ بَيۡنِ يَدَيۡهِ وَمِنۡ خَلۡفِهِۦ رَصَدٗا","لِّيَعۡلَمَ أَن قَدۡ أَبۡلَغُواْ رِسَٰلَٰتِ رَبِّهِمۡ وَأَحَاطَ بِمَا لَدَيۡهِمۡ وَأَحۡصَىٰ كُلَّ شَيۡءٍ عَدَدَۢا"],"g":5448},"73":{"n":73,"name":"المزمل","v":["يَـٰٓأَيُّهَا ٱلۡمُزَّمِّلُ","قُمِ ٱلَّيۡلَ إِلَّا قَلِيلٗا","نِّصۡفَهُۥٓ أَوِ ٱنقُصۡ مِنۡهُ قَلِيلًا","أَوۡ زِدۡ عَلَيۡهِ وَرَتِّلِ ٱلۡقُرۡءَانَ تَرۡتِيلًا","إِنَّا سَنُلۡقِي عَلَيۡكَ قَوۡلٗا ثَقِيلًا","إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا","إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا","وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا","رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا","وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا","وَذَرۡنِي وَٱلۡمُكَذِّبِينَ أُوْلِي ٱلنَّعۡمَةِ وَمَهِّلۡهُمۡ قَلِيلًا","إِنَّ لَدَيۡنَآ أَنكَالٗا وَجَحِيمٗا","وَطَعَامٗا ذَا غُصَّةٖ وَعَذَابًا أَلِيمٗا","يَوۡمَ تَرۡجُفُ ٱلۡأَرۡضُ وَٱلۡجِبَالُ وَكَانَتِ ٱلۡجِبَالُ كَثِيبٗا مَّهِيلًا","إِنَّآ أَرۡسَلۡنَآ إِلَيۡكُمۡ رَسُولٗا شَٰهِدًا عَلَيۡكُمۡ كَمَآ أَرۡسَلۡنَآ إِلَىٰ فِرۡعَوۡنَ رَسُولٗا","فَعَصَىٰ فِرۡعَوۡنُ ٱلرَّسُولَ فَأَخَذۡنَٰهُ أَخۡذٗا وَبِيلٗا","فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا","ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا","إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا","۞إِنَّ رَبَّكَ يَعۡلَمُ أَنَّكَ تَقُومُ أَدۡنَىٰ مِن ثُلُثَيِ ٱلَّيۡلِ وَنِصۡفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٞ مِّنَ ٱلَّذِينَ مَعَكَۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيۡلَ وَٱلنَّهَارَۚ عَلِمَ أَن لَّن تُحۡصُوهُ فَتَابَ عَلَيۡكُمۡۖ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنَ ٱلۡقُرۡءَانِۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرۡضَىٰ وَءَاخَرُونَ يَضۡرِبُونَ فِي ٱلۡأَرۡضِ يَبۡتَغُونَ مِن فَضۡلِ ٱللَّهِ وَءَاخَرُونَ يُقَٰتِلُونَ فِي سَبِيلِ ٱللَّهِۖ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ وَأَقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗاۚ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيۡرٗا وَأَعۡظَمَ أَجۡرٗاۚ وَٱسۡتَغۡفِرُواْ ٱللَّهَۖ إِنَّ ٱللَّهَ غَفُورٞ رَّحِيمُۢ"],"g":5476},"74":{"n":74,"name":"المدثر","v":["يَـٰٓأَيُّهَا ٱلۡمُدَّثِّرُ","قُمۡ فَأَنذِرۡ","وَرَبَّكَ فَكَبِّرۡ","وَثِيَابَكَ فَطَهِّرۡ","وَٱلرُّجۡزَ فَٱهۡجُرۡ","وَلَا تَمۡنُن تَسۡتَكۡثِرُ","وَلِرَبِّكَ فَٱصۡبِرۡ","فَإِذَا نُقِرَ فِي ٱلنَّاقُورِ","فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ","عَلَى ٱلۡكَٰفِرِينَ غَيۡرُ يَسِيرٖ","ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا","وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا","وَبَنِينَ شُهُودٗا","وَمَهَّدتُّ لَهُۥ تَمۡهِيدٗا","ثُمَّ يَطۡمَعُ أَنۡ أَزِيدَ","كَلَّآۖ إِنَّهُۥ َجِّرُونَهَا تَفۡجِيرٗا","يُوفُونَ بِٱلنَّذۡرِ وَيَخَافُونَ يَوۡمٗا كَانَ شَرُّهُۥ مُسۡتَطِيرٗا","وَيُطۡعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسۡكِينٗا وَيَتِيمٗا وَأَسِيرًا","إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا","إِنَّا نَخَافُ مِن رَّبِّنَا يَوۡمًا عَبُوسٗا قَمۡطَرِيرٗا","فَوَقَىٰهُمُ ٱللَّهُ شَرَّ ذَٰلِكَ ٱلۡيَوۡمِ وَلَقَّىٰهُمۡ نَضۡرَةٗ وَسُرُورٗا","وَجَزَىٰهُم بِمَا صَبَرُواْ جَنَّةٗ وَحَرِيرٗا","مُّتَّكِـِٔينَ فِيهَا عَلَى ٱلۡأَرَآئِكِۖ لَا يَرَوۡنَ فِيهَا شَمۡسٗا وَلَا زَمۡهَرِيرٗا","وَدَانِيَةً عَلَيۡهِمۡ ظِلَٰلُهَا وَذُلِّلَتۡ قُطُوفُهَا تَذۡلِيلٗا","وَيُطَافُ عَلَيۡهِم بِـَٔانِيَةٖ مِّن فِضَّةٖ وَأَكۡوَابٖ كَانَتۡ قَوَارِيرَا۠","قَوَارِيرَاْ مِن فِضَّةٖ قَدَّرُوهَا تَقۡدِيرٗا","وَيُسۡقَوۡنَ فِيهَا كَأۡسٗا كَانَ مِزَاجُهَا زَنجَبِيلًا","عَيۡنٗا فِيهَا تُسَمَّىٰ سَلۡسَبِيلٗا","۞وَيَطُوفُ عَلَيۡهِمۡ وِلۡدَٰنٞ مُّخَلَّدُونَ إِذَا رَأَيۡتَهُمۡ حَسِبۡتَهُمۡ لُؤۡلُؤٗا مَّنثُورٗا","وَإِذَا رَأَيۡتَ ثَمَّ رَأَيۡتَ نَعِيمٗا وَمُلۡكٗا كَبِيرًا","عَٰلِيَهُمۡ ثِيَابُ سُندُسٍ خُضۡرٞ وَإِسۡتَبۡرَقٞۖ وَحُلُّوٓاْ أَسَاوِرَ مِن فِضَّةٖ وَسَقَىٰهُمۡ رَبُّهُمۡ شَرَابٗا طَهُورًا","إِنَّ هَٰذَا كَانَ لَكُمۡ جَزَآءٗ وَكَانَ سَعۡيُكُم مَّشۡكُورًا","إِنَّا نَحۡنُ نَزَّلۡنَا عَلَيۡكَ ٱلۡقُرۡءَانَ تَنزِيلٗا","فَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ وَلَا تُطِعۡ مِنۡهُمۡ ءَاثِمًا أَوۡ كَفُورٗا","وَٱذۡكُرِ ٱسۡمَ رَبِّكَ بُكۡرَةٗ وَأَصِيلٗا","وَمِنَ ٱلَّيۡلِ فَٱسۡجُدۡ لَهُۥ وَسَبِّحۡهُ لَيۡلٗا طَوِيلًا","إِنَّ هَـٰٓؤُلَآءِ يُحِبُّونَ ٱلۡعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمۡ يَوۡمٗا ثَقِيلٗا","نَّحۡنُ خَلَقۡنَٰهُمۡ وَشَدَدۡنَآ أَسۡرَهُمۡۖ وَإِذَا شِئۡنَا بَدَّلۡنَآ أَمۡثَٰلَهُمۡ تَبۡدِيلًا","إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلٗا","وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمٗا","يُدۡخِلُ مَن يَشَآءُ فِي رَحۡمَتِهِۦۚ وَٱلظَّـٰلِمِينَ أَعَدَّ لَهُمۡ عَذَابًا أَلِيمَۢا"],"g":5592},"77":{"n":77,"name":"المرسلات","v":["وَٱلۡمُرۡسَلَٰتِ عُرۡفٗا","فَٱلۡعَٰصِفَٰتِ عَصۡفٗا","وَٱلنَّـٰشِر "90":{"n":90,"name":"البلد","v":["لَآ أُقۡسِمُ بِهَٰذَا ٱلۡبَلَدِ","وَأَنتَ حِلُّۢ بِهَٰذَا ٱلۡبَلَدِ","وَوَالِدٖ وَمَا وَلَدَ","لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِي كَبَدٍ","أَيَحۡسَبُ أَن لَّن يَقۡدِرَ عَلَيۡهِ أَحَدٞ","يَقُولُ أَهۡلَكۡتُ مَالٗا لُّبَدًا","أَيَحۡسَبُ أَن لَّمۡ يَرَهُۥٓ أَحَدٌ","أَلَمۡ نَجۡعَل لَّهُۥ عَيۡنَيۡنِ","وَلِسَانٗا وَشَفَتَيۡنِ","وَهَدَيۡنَٰهُ ٱلنَّجۡدَيۡنِ","فَلَا ٱقۡتَحَمَ ٱلۡعَقَبَةَ","وَمَآ أَدۡرَىٰكَ مَا ٱلۡعَقَبَةُ","فَكُّ رَقَبَةٍ","أَوۡ إِطۡعَٰمٞ فِي يَوۡمٖ ذِي مَسۡغَبَةٖ","يَتِيمٗا ذَا مَقۡرَبَةٍ","أَوۡ مِسۡكِينٗا ذَا مَتۡرَبَةٖ","ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ","أُوْلَـٰٓئِكَ أَصۡحَٰبُ ٱلۡمَيۡمَنَةِ","وَٱلَّذِينَ كَفَرُواْ بِـَٔايَٰتِنَا هُمۡ أَصۡحَٰبُ ٱلۡمَشۡـَٔمَةِ","عَلَيۡهِمۡ نَارٞ مُّؤۡصَدَةُۢ"],"g":6024},"91":{"n":91,"name":"الشمس","v":["وَٱلشَّمۡسِ وَضُحَىٰهَا","وَٱلۡقَمَرِ إِذَا تَلَىٰهَا","وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","وَٱلَّيۡلِ إِذَا يَغۡشَىٰهَا","وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","وَٱلۡأَرۡضِ وَمَا طَحَىٰهَا","وَنَفۡسٖ وَمَا سَوَّىٰهَا","فَأَلۡهَمَهَا فُجُورَهَا وَتَقۡوَىٰهَا","قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا","وَقَدۡ خَابَ مَن دَسَّىٰهَا","كَذَّبَتۡ ثَمُودُ بِطَغۡوَىٰهَآ","إِذِ ٱنۢبَعَثَ أَشۡقَىٰهَا","فَقَالَ لَهُمۡ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقۡيَٰهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمۡدَمَ عَلَيۡهِمۡ رَبُّهُم بِذَنۢبِهِمۡ فَسَوَّىٰهَا","وَلَا يَخَافُ عُقۡبَٰهَا"],"g":6044},"92":{"n":92,"name":"الليل","v":["وَٱلَّيۡلِ إِذَا يَغۡشَىٰ","وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","وَمَا خَلَقَ ٱلذَّكَرَ وَٱلۡأُنثَىٰٓ","إِنَّ سَعۡيَكُمۡ لَشَتَّىٰ","فَأَمَّا مَنۡ أَعۡطَىٰ وَٱتَّقَىٰ","وَصَدَّقَ بِٱلۡحُسۡنَىٰ","فَسَنُيَسِّرُهُۥ لِلۡيُسۡرَىٰ","وَأَمَّا مَنۢ بَخِلَ وَٱسۡتَغۡنَىٰ","وَكَذَّبَ بِٱلۡحُسۡنَىٰ","فَسَنُيَسِّرُهُۥ لِلۡعُسۡرَىٰ","وَمَا يُغۡنِي عَنۡهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","إِنَّ عَلَيۡنَا لَلۡهُدَىٰ","وَإِنَّ لَنَا لَلۡأٓخِرَةَ وَٱلۡأُولَىٰ","فَأَنذَرۡتُكُمۡ نَارٗا تَلَظَّىٰ","لَا يَصۡلَىٰهَآ إِلَّا ٱلۡأَشۡقَى","ٱلَّذِي كَذَّبَ وَتَوَلَّىٰ","وَسَيُجَنَّبُهَا ":97,"name":"القدر","v":["إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ","وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ","لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ","تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ","سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ"],"g":6126},"98":{"n":98,"name":"البينة","v":["لَمۡ يَكُنِ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأۡتِيَهُمُ ٱلۡبَيِّنَةُ","رَسُولٞ مِّنَ ٱللَّهِ يَتۡلُواْ صُحُفٗا مُّطَهَّرَةٗ","فِيهَا كُتُبٞ قَيِّمَةٞ","وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ إِلَّا مِنۢ بَعۡدِ مَا جَآءَتۡهُمُ ٱلۡبَيِّنَةُ","وَمَآ أُمِرُوٓاْ إِلَّا لِيَعۡبُدُواْ ٱللَّهَ مُخۡلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤۡتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلۡقَيِّمَةِ","إِنَّ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ فِي نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۚ أُوْلَـٰٓئِكَ هُمۡ شَرُّ ٱلۡبَرِيَّةِ","إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ أُوْلَـٰٓئِكَ هُمۡ خَيۡرُ ٱلۡبَرِيَّةِ","جَزَآؤُهُمۡ عِندَ رَبِّهِمۡ جَنَّـٰتُ عَدۡنٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدٗاۖ رَّضِيَ ٱللَّهُ عَنۡهُمۡ وَرَضُواْ عَنۡهُۚ ذَٰلِكَ لِمَنۡ خَشِيَ رَبَّهُۥ"],"g":6131},"99":{"n":99,"name":"الزلزلة","v":["إِذَا زُلۡزِلَتِ ٱلۡأَرۡضُ زِلۡزَالَهَا","وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا","وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا","يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا","بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا","يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ","فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ","وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ"],"g":6139},"100":{"n":100,"name":"العاديات","v":["وَٱلۡعَٰدِيَٰتِ ضَبۡحٗا","فَٱلۡمُورِيَٰتِ قَدۡحٗا","فَٱلۡمُغِيرَٰتِ صُبۡحٗا","فَأَثَرۡنَ بِهِۦ نَقۡعٗا","فَوَسَطۡنَ بِهِۦ جَمۡعًا","إِنَّ ٱلۡإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٞ","وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٞ","وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ","۞أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ","وَحُصِّلَ مَا فِي ٱلصُّدُور /* ---------- state ---------- */
const KEY="bustan-quran-v1";
function freshKid(k){return {stars:0, mem:{}, weak:{}, listened:{}, level:k.level, goal:"amma"}}
function freshState(){const s={kids:{},updatedAt:0};KIDS.forEach(k=>s.kids[k.id]=freshKid(k));return s}
let S=freshState();
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&p.kids) S=mergeShape(p)}}catch(e){}
function mergeShape(p){const s=freshState(); s.updatedAt=p.updatedAt||0; KIDS.forEach(k=>{s.kids[k.id]=Object.assign(freshKid(k),p.kids[k.id]||{})}); return s}
let dbRef=null, saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ if(dbRef) dbRef.set({json:JSON.stringify(S)}).catch(()=>{}) },1500);
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/bustan");
    const snap=await dbRef.get();
    if(snap.exists){const d=snap.data(); const p=JSON.parse(d.json||"{}");
      if(p.kids && (p.updatedAt||0)>(S.updatedAt||0)){S=mergeShape(p); try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} render()}
      else if((S.updatedAt||0)>(p.updatedAt||0)) dbRef.set({json:JSON.stringify(S)}).catch(()=>{});
    } else if(S.updatedAt) dbRef.set({json:JSON.stringify(S)}).catch(()=>{});
  }catch(e){}
})();

const kidById=id=>KIDS.find(k=>k.id===id);
const ar=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const words=v=>v.split(" ").filter(w=>/[ء-يٱ]/.test(w));
const sname=n=>QURAN[n].name;
function kidList(kid){const st=S.kids[kid.id]; const base=[1].concat(GOALS[st.goal].list); const other=st.goal==="amma"?TABARAK:AMMA; return {goal:base, other}}
function memCount(id){const st=S.kids[id]; return GOALS[st.goal].list.filter(n=>st.mem[n]).length}
function goalTotal(id){return GOALS[S.kids[id].goal].list.length}
function weakCount(id,n){const w=S.kids[id].weak; let c=0; for(const k in w) if(k.startsWith(n+":")) c+=w[k]; return c}
function addStars(id,k){S.kids[id].stars+=k; save()}

const player=$("#player");
let stopAt=null, onSegEnd=null, rafId=null, playToken=0;
function segFor(n,i){ // i: 1-based ayah, 0 = basmala
  const t=TIMINGS[n]; const off=t.hasBasmala?1:0; const idx=i===0?0:(i-1+off);
  return [t.starts[idx], idx+1<t.starts.length?t.starts[idx+1]:t.end];
}
function stopAudio(){playToken++; player.pause(); stopAt=null; onSegEnd=null; cancelAnimationFrame(rafId)}
function playSeg(n,i,cb){
  stopAudio(); const tok=playToken;
  const [a,b]=segFor(n,i); const src="audio/"+String(n).padStart(3,"0")+".mp3";
  const start=()=>{ if(tok!==playToken) return; player.currentTime=a; player.muted=false; stopAt=b-0.04; onSegEnd=cb; const p=player.play(); if(p&&p.catch) p.catch(()=>{}); tick(tok) };
  if(!player.src.endsWith(src)){ player.src=src; player.preload="auto"; player.load();
    player.muted=true; player.play().catch(()=>{}); // unlock on iOS within the tap
    const wait=()=>{ if(tok!==playToken) return; if(player.readyState>=1 && player.seekable.length) start(); else setTimeout(wait,60) }; wait();
  } else start();
  return b-a;
}
function tick(tok){
  if(tok!==playToken) return;
  if(stopAt!=null && player.currentTime>=stopAt){ player.pause(); const cb=onSegEnd; stopAt=null; onSegEnd=null; if(cb) cb(); return }
  rafId=requestAnimationFrame(()=>tick(tok));
}

/* ---------- routing ---------- */
let view={name:"home"};
function go(v){stopAudio(); clearTimeout(listen.timer); view=v; render(); window.scrollTo(0,0)}
function render(){
  const app=$("#app");
  if(view.name==="home") app.innerHTML='<div class="sadu" aria-hidden="true"></div>'+homeHTML();
  else if(view.name==="child") app.innerHTML=childHTML(view.kid);
  else if(view.name==="surah") app.innerHTML=surahHTML(view);
  else if(view.name==="game") app.innerHTML=gameHTML();
  else if(view.name==="parent") app.innerHTML=parentHTML();
  bind();
}

/* listen & repeat loop */
const listen={on:false, rep:3, ayah:1, count:0, timer:null};
function listenStop(){listen.on=false; clearTimeout(listen.timer); stopAudio(); document.querySelectorAll(".ayah.on").forEach(e=>e.classList.remove("on"))}
function listenStep(){
  if(!listen.on) return; const n=view.n, q=QURAN[n];
  if(listen.ayah>q.v.length){ listenStop(); const st=S.kids[view.kid]; st.listened[n]=(st.listened[n]||0)+1; addStars(view.kid,1); toast("ما شاء الله! ⭐ نجمة جديدة"); render(); setMood("lbuddy","cheer","ما شاء الله عليج! خلّصتي السورة ⭐"); return }
  document.querySelectorAll(".ayah").forEach(e=>e.classList.toggle("on",+e.dataset.ayah===listen.ayah));
  const el=document.querySelector(`.ayah[data-ayah="${listen.ayah}"]`); if(el) el.scrollIntoView({block:"center",behavior:"smooth"});
  setMood("lbuddy","think","اسمعي… 👂");
  const len=playSeg(n,listen.ayah,()=>{
    if(!listen.on) return; setMood("lbuddy","cheer","دورج! ردّدي 🗣️");
    listen.timer=setTimeout(()=>{ listen.count++; if(listen.count>=listen.rep){listen.count=0; listen.ayah++} listenStep() }, Math.max(2500,len*1000+800));
  });
}

/* ---------- games ---------- */
let G=null;
function poolFor(kid){const st=S.kids[kid]; let list=[1].concat(GOALS[st.goal].list).filter(n=>st.mem[n]||st.listened[n]); if(list.length<3) list=[1,114,113,112,111,110,109,108]; return list}
function startGame(type,n,opts={}){
  stopAudio();
  G={type, n, kid:opts.evalFor||view.kid, by:view.kid, i:0, total:5, score:[], back:{...view}, daily:!!opts.daily};
  if(type==="order") G.total=1;
  nextQ(); view={name:"game"}; render();
}
function weightedAyah(kid,n){const q=QURAN[n]; const w=S.kids[kid].weak; const weak=[]; for(let i=1;i<=q.v.length;i++) if(w[n+":"+i]) weak.push(i); return (weak.length&&Math.random()<.6)?pick(weak):1+(Math.random()*q.v.length|0)}
function nextQ(){
  const t=G.daily?pick(S.kids[G.kid].level>=3?["complete","which","recite"]:["which","which"]):G.type;
  const n=G.n||pick(poolFor(G.kid)); G.cur={t,n};
  const q=QURAN[n];
  if(t==="complete"){
    let tries=0,a; do{a=weightedAyah(G.kid,n);tries++}while(words(q.v[a-1]).length<4&&tries<15);
    const w=words(q.v[a-1]); if(w.length<4){G.cur.t="which"; return nextQ2()}
    const cut=Math.ceil(w.length/2); const right=w.slice(cut).join(" ");
    const pool=[]; const near=[n, ...poolFor(G.kid)];
    near.forEach(m=>QURAN[m].v.forEach((v,i)=>{const ww=words(v); if(ww.length>=3&&!(m===n&&i===a-1)) pool.push(ww.slice(Math.ceil(ww.length/2)).join(" "))}));
    const wrong=shuffle([...new Set(pool)].filter(x=>x!==right)).slice(0,2);
    Object.assign(G.cur,{a,start:w.slice(0,cut).join(" "),right,opts:shuffle([right,...wrong])});
  } else if(t==="which") nextQ2();
  else if(t==="recite"){
    const a=Math.min(q.v.length-1, Math.max(1,weightedAyah(G.kid,n)-1)) || 1;
    Object.assign(G.cur,{a:q.v.length>1?a:1,revealed:false});
  } else if(t==="order"){
    const len=q.v.length; const span=Math.min(len,5); const st0=1+(Math.random()*(len-span+1)|0);
    const ids=[]; for(let i=st0;i<st0+span;i++) ids.push(i);
    Object.assign(G.cur,{ids,shuffled:shuffle(ids),placed:[],mistakes:0});
  } else if(t==="after"){
    const order=[1].concat(TABARAK).concat(AMMA.slice().reverse()); // mushaf order of what we have
    const mine=order.filter(m=>m!==114 && m!==1);
    const s=pick(mine.filter(m=>m>=67)); const right=s+1;
    const wrong=shuffle(order.filter(m=>m!==right&&m!==s)).slice(0,2);
    Object.assign(G.cur,{s,right,opts:shuffle([right,...wrong])});
  }
}
function nextQ2(){
  const kid=G.kid; const pool=poolFor(kid); const n=G.n||pick(pool); const a=weightedAyah(kid,n);
  const wrong=shuffle([...new Set(pool.concat([1,114,113,112,108,103]))].filter(m=>m!==n)).slice(0,2);
  G.cur={t:"which",n,a,opts:shuffle([n,...wrong])};
}
function gameHTML(){
  const c=G.cur, kid=kidById(G.kid), by=kidById(G.by), q=QURAN[c.n];
  const dots=G.total>1?`<div class="progress-dots">${Array.from({length:G.total},(_,i)=>`<i class="${G.score[i]===true?"ok":G.score[i]===false?"no":""}"></i>`).join("")}</div>`:"";
  let body="";
  if(c.t==="complete") body=`<div class="q">سورة ${q.name}: أكملي الآية</div><div class="big-ayah">${esc(c.start)} …</div>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o)}</button>`).join("")}</div>`;
  else if(c.t==="which") body=`<div class="q">اسمعي الآية… من أي سورة؟</div><div class="row" style="justify-content:center"><button class="btn big sun" id="hear">🔊 اسمعي</button></div>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt name" data-opt="${i}">${sname(o)}</button>`).join("")}</div>`;
  else if(c.t==="recite") body=`<div class="q">${G.kid!==G.by?`${by.name} تسمّع لـ${kid.name} · `:""}سورة ${q.name}: اقرئي الآية اللي بعد</div>
    <div class="big-ayah">${esc(q.v[c.a-1])}</div>
    ${c.revealed?`<div class="mushaf"><div class="ayat" style="text-align:center">${esc(q.v[c.a]||"")}</div></div>
      <div class="row" style="justify-content:center"><button class="btn big" data-judge="1">✓ أحسنتِ</button><button class="btn big rose" data-judge="0">↺ نعيدها</button></div>`
     :`<div class="row" style="justify-content:center"><button class="btn big soft" id="reveal">شوفي الجواب واسمعيه</button></div>`}`;
  else if(c.t==="order") body=`<div class="q">سورة ${q.name}: المسي الآيات بالترتيب</div>
    <div class="placed">${c.placed.map(i=>`<div>${esc(q.v[i-1])}</div>`).join("")}</div>
    <div class="opts">${c.shuffled.map(i=>`<button class="opt ${c.placed.includes(i)?"done":""}" data-ord="${i}" ${c.placed.includes(i)?"disabled":""}>${esc(q.v[i-1])}</button>`).join("")}</div>`;
  else if(c.t==="after") body=`<div class="q">شو السورة اللي بعد سورة <b>${sname(c.s)}</b> في المصحف؟</div>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt name" data-opt="${i}">${sname(o)}</button>`).join("")}</div>`;
  return `<div class="row"><button class="back" id="gback">→ رجوع</button><span class="spacer"></span>${dots}<span class="stars">⭐ ${ar(S.kids[G.kid].stars)}</span></div>
  ${buddy("abdulrahman",G.i===0?"أتحداج! يلا نشوف 💪":"يلا السؤال اللي بعده!",{id:"gbuddy",small:true})}
  <section class="play">${body}</section>`;
}
function answer(ok){
  const c=G.cur; G.score[G.i]=ok;
  setMood("gbuddy",ok?"cheer":"think",ok?pick(["كفو! ⭐","ما شاء الله عليج!","شطورة! 👏"]):pick(["ولا يهمج، نحاول مرة ثانية","قريبة! نعيدها سوا","أنا بعد أغلط أحيانًا 😅"]));
  if(!ok && c.a) { const w=S.kids[G.kid].weak; const k=c.n+":"+(c.t==="recite"?c.a+1:c.a); w[k]=(w[k]||0)+1; save() }
  if(ok && c.a && c.t==="recite"){ const w=S.kids[G.kid].weak; const k=c.n+":"+(c.a+1); if(w[k]){w[k]--; if(!w[k]) delete w[k]; save()} }
  const wait=c.t==="complete"?Math.min(7000,(c.len||1)*1000+300):(ok?700:1300);
  setTimeout(()=>{ if(!G) return; stopAudio(); G.i++; if(G.i>=G.total) finishGame(); else {nextQ(); render()} }, wait);
}
function finishGame(){
  const good=G.score.filter(Boolean).length; const stars=G.total===1?(G.cur.mistakes===0?3:G.cur.mistakes<3?2:1):(good>=5?3:good>=3?2:good>=1?1:0);
  if(stars) addStars(G.kid,stars);
  if(G.kid!==G.by && stars) addStars(G.by,1);
  toast(stars?`${"⭐".repeat(stars)} أحسنتِ!`:"نحاول مرة ثانية 💪");
  const b=G.back; G=null; view=b; render();
}

  <section class="panel">
    <div class="field"><label>المستوى</label><div class="chips">${[1,2,3,4].map(l=>`<button class="chip" data-level="${l}" aria-pressed="${st.level===l}">${LEVELS[l]}</button>`).join("")}</div></div>
    <div class="field"><label>هدف الجائزة الكبرى</label><div class="chips">${Object.entries(GOALS).map(([g,o])=>`<button class="chip" data-goal="${g}" aria-pressed="${st.goal===g}">${o.name}</button>`).join("")}</div>
      <p class="note">${kid.name}: ${ar(memCount(id))} من ${ar(goalTotal(id))} سورة · ⭐ ${ar(st.stars)}</p></div>
  </section>
  <section class="panel">
    <div class="row"><h3>السور اللي سمّعتها لكِ</h3><span class="spacer"></span>
      <button class="btn ghost" data-markall="amma">✓ كل جزء عمّ</button><button class="btn ghost" data-markall="tabarak">✓ كل جزء تبارك</button></div>
    <p class="note">المسي السورة بعد ما تسمّعها لكِ ${kid.name} بدون أخطاء. هذا اللي يحرّك مسار الجائزة.</p>
    <div class="chips">${list.map(n=>`<button class="chip ${weakCount(id,n)?"weakc":""}" data-mem="${n}" aria-pressed="${!!st.mem[n]}">${sname(n)}</button>`).join("")}</div>
  </section>
  <section class="panel"><h3>آيات تتعثّر فيها</h3>
    ${weakList.length?`<div class="chips">${weakList.map(([k,c])=>{const [n,a]=k.split(":");return `<span class="chip weakc">${sname(+n)} · آية ${ar(a)} (${ar(c)})</span>`}).join("")}</div>
      <p class="note">هذي الآيات تطلع لها أكثر في الألعاب والتسميع لين تثبت.</p>`:`<p class="note">ما فيه آيات متعثّرة إلى الحين.</p>`}
  </section>
  <section class="panel"><h3>للأم</h3>
    <p class="note">التلاوة بصوت الشيخ محمود خليل الحصري (المصحف المعلّم). النص بالرسم العثماني. القصص ومعاني الكلمات مكتوبة للأطفال؛ راجعيها وقولي لي إذا تبين أعدّل شي.</p>
    ${P.confirm?`<div class="confirm"><span>متأكدة؟ بتنمسح نجوم ${kid.name} وتقدّمها.</span><button class="btn rose" id="doReset">نعم، امسحي</button><button class="btn ghost" id="noReset">لا</button></div>`
      :`<button class="btn ghost" id="askReset" style="align-self:flex-start">مسح تقدّم ${kid.name}</button>`}
  </section>`;
}

/* ---------- celebration ---------- */
function celebrate(kid){
  const d=document.createElement("div"); d.className="celebrate";
  d.innerHTML=`<div class="card"><img src="chars/yaddoah.png" alt="اليدّوه" style="height:150px;width:auto"><div class="gift">🎁</div><h2>مبروك يا ${kid.name}!</h2><p>خلّصتِ ${GOALS[S.kids[kid.id].goal].name} كامل. الجائزة الكبرى لكِ: الآيباد!</p><button class="btn sun big">الحمد لله 🤍</button></div>`;
  d.querySelector("button").onclick=()=>d.remove(); document.body.appendChild(d);
}

/* ---------- events ---------- */
function bind(){
  const app=$("#app");
  app.onclick=e=>{
    const b=e.target.closest("button,.ayah"); if(!b) return;
    const d=b.dataset;
    if(d.home!==undefined) return go({name:"home"});
    if(d.kid && b.classList.contains("kid")) return go({name:"child",kid:d.kid});
    if(d.kid && b.classList.contains("back")) return go({name:"child",kid:d.kid});
    if(d.surah) { listenStop(); listen.ayah=1; listen.count=0; return go({name:"surah",kid:view.kid,n:+d.surah,tab:"listen"}) }
    if(d.tab){ listenStop(); view.tab=d.tab; return render() }
    if(d.rep){ listen.rep=+d.rep; document.querySelectorAll("[data-rep]").forEach(x=>x.setAttribute("aria-pressed",x===b)); return }
    if(b.id==="hideTxt"){ view.hide=!view.hide; return render() }
    if(b.id==="lplay"){ if(listen.on){listenStop(); b.textContent="▶ ابدئي"; setMood("lbuddy",null,"وقفنا. اضغطي ابدئي نكمّل")} else {listen.on=true; listen.count=0; b.textContent="⏸ إيقاف"; listenStep()} return }
    if(b.classList.contains("ayah")){ listenStop(); const a=+d.ayah; b.classList.add("on"); playSeg(view.n,a,()=>b.classList.remove("on")); return }
    if(d.daily) return startGame("mix",null,{daily:true});
    if(d.helper){ return pickSister() }
    if(d.sister){ return startGame("recite",null,{evalFor:d.sister}) }
    if(d.game){ return startGame(d.game, d.n?+d.n:null) }
    if(b.id==="gback"){ const bk=G.back; G=null; stopAudio(); view=bk; return render() }
    if(b.id==="hear"){ playSeg(G.cur.n,G.cur.a,()=>{}); return }
    if(b.id==="reveal"){ G.cur.revealed=true; render(); playSeg(G.cur.n,G.cur.a+1,()=>{}); return }
    if(d.judge!==undefined){ const ok=d.judge==="1"; if(ok) toast("ما شاء الله ⭐"); document.querySelectorAll("[data-judge]").forEach(x=>x.disabled=true); return answer(ok) }
    if(d.opt!==undefined){ const c=G.cur; if(c.answered) return; const o=c.opts[+d.opt];
      const ok=(c.t==="which"?o===c.n:o===c.right); b.classList.add(ok?"ok":"no");
      if(!ok){ const ri=c.opts.findIndex(x=>c.t==="which"?x===c.n:x===c.right); app.querySelector(`[data-opt="${ri}"]`).classList.add("ok") }
      c.answered=true; if(c.t==="complete") c.len=playSeg(c.n,c.a,()=>{}); return answer(ok) }
    if(d.ord){ const c=G.cur; const i=+d.ord; const want=c.ids[c.placed.length];
      if(i===want){ setMood("gbuddy","cheer","صح! كمّلي 👏"); c.placed.push(i); playSeg(c.n,i,()=>{}); if(c.placed.length===c.ids.length){ render(); G.score[0]=true; setTimeout(finishGame,1600) } else render() }
      else { setMood("gbuddy","think","أوه! مو هذي، شوفي مرة ثانية"); c.mistakes++; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); const w=S.kids[G.kid].weak,k=c.n+":"+want; w[k]=(w[k]||0)+1; save() } return }
    // parent
    if(d.pk){ P.kid=d.pk; P.confirm=false; return render() }
    if(d.level){ S.kids[P.kid].level=+d.level; save(); return render() }
    if(d.goal){ S.kids[P.kid].goal=d.goal; save(); return render() }
    if(d.mem){ const st=S.kids[P.kid], n=+d.mem; const before=memCount(P.kid)>=goalTotal(P.kid);
      if(st.mem[n]) delete st.mem[n]; else { st.mem[n]=true; st.stars+=2 } save(); render();
      if(!before && memCount(P.kid)>=goalTotal(P.kid)) celebrate(kidById(P.kid)); return }
    if(d.markall){ const st=S.kids[P.kid]; const before=memCount(P.kid)>=goalTotal(P.kid); GOALS[d.markall].list.forEach(n=>st.mem[n]=true); if(d.markall==="amma") st.mem[1]=true; save(); render();
      if(!before && memCount(P.kid)>=goalTotal(P.kid)) celebrate(kidById(P.kid)); return }
    if(b.id==="askReset"){ P.confirm=true; return render() }
    if(b.id==="noReset"){ P.confirm=false; return render() }
    if(b.id==="doReset"){ const k=kidById(P.kid); S.kids[P.kid]=freshKid(k); P.confirm=false; save(); toast("تم المسح"); return render() }
  };
  const ph=$("#parentHold");
  if(ph){ let t=null, f=ph.querySelector(".fill");
    const down=e=>{e.preventDefault(); f.style.transition="transform 1.6s linear"; f.style.transform="scaleX(1)"; t=setTimeout(()=>go({name:"parent"}),1600)};
    const up=()=>{clearTimeout(t); f.style.transition="transform .2s"; f.style.transform="scaleX(0)"};
    ph.addEventListener("pointerdown",down); ["pointerup","pointerleave","pointercancel"].forEach(ev=>ph.addEventListener(ev,up));
    ph.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.shiftKey) go({name:"parent"})});
  }
}
function pickSister(){
  const app=$("#app");
  app.innerHTML=`<div class="row"><button class="back" data-kid="fatima">→ فاطمة</button></div><h2>لمين بتسمّعين اليوم؟</h2>
  <section class="kids">${KIDS.filter(k=>k.id!=="fatima").map(k=>`<button class="kid" data-sister="${k.id}"><span class="avatar" style="background:${k.tint}">${k.emoji}</span><span class="name">${k.name}</span></button>`).join("")}</section>
  <p class="note">اقرئي لأختك أول الآية، وخليها تكمل الآية اللي بعدها. إذا قرأت صح اضغطي «أحسنتِ». وأنتِ بعد تاخذين نجمة على تسميعك.</p>`;
}
render();
</script>
